<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashtanga Primary Series Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.css" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-primary: #0f0f1a;
  --bg-secondary: #1a1a2e;
  --bg-card: #16213e;
  --bg-card-hover: #1a2745;
  --bg-input: #0f0f1a;
  --text-primary: #e8e8f0;
  --text-secondary: #9898b0;
  --text-muted: #6868a0;
  --accent: #7c5cbf;
  --accent-light: #9b7fd4;
  --accent-glow: rgba(124, 92, 191, 0.15);
  --green: #4ade80;
  --green-bg: rgba(74, 222, 128, 0.1);
  --green-border: rgba(74, 222, 128, 0.25);
  --blue: #60a5fa;
  --blue-bg: rgba(96, 165, 250, 0.1);
  --blue-border: rgba(96, 165, 250, 0.25);
  --amber: #fbbf24;
  --amber-bg: rgba(251, 191, 36, 0.1);
  --amber-border: rgba(251, 191, 36, 0.25);
  --red: #f87171;
  --red-bg: rgba(248, 113, 113, 0.1);
  --red-border: rgba(248, 113, 113, 0.25);
  --gray: #6868a0;
  --gray-bg: rgba(104, 104, 160, 0.1);
  --gray-border: rgba(104, 104, 160, 0.25);
  --border: rgba(255, 255, 255, 0.06);
  --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
  --radius: 12px;
  --radius-sm: 8px;
}

html { font-size: 15px; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.5;
  overflow-x: hidden;
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 3px; }

/* Layout */
.app { max-width: 1200px; margin: 0 auto; padding: 20px 16px 80px; }

/* Header */
.header {
  text-align: center;
  padding: 32px 16px 24px;
  position: relative;
}
.header-greeting {
  font-size: 0.85rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 4px;
}
.header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 2rem;
  font-weight: 600;
  background: linear-gradient(135deg, var(--accent-light), var(--text-primary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 4px;
}
.header-sub {
  color: var(--text-secondary);
  font-size: 0.9rem;
  font-weight: 300;
}

/* Stats Overview */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
  transition: transform 0.2s, border-color 0.2s;
}
.stat-card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.12); }
.stat-number {
  font-size: 1.8rem;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 2px;
}
.stat-label {
  font-size: 0.7rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}
.stat-complete .stat-number { color: var(--green); }
.stat-progress .stat-number { color: var(--blue); }
.stat-stuck .stat-number { color: var(--amber); }
.stat-streak .stat-number { color: var(--accent-light); }

/* Progress Bar */
.overall-progress {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 24px;
}
.progress-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.progress-title {
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--text-secondary);
}
.progress-pct {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--accent-light);
}
.progress-bar-bg {
  height: 8px;
  background: var(--bg-primary);
  border-radius: 4px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-light));
  border-radius: 4px;
  transition: width 0.6s ease;
}

/* Tabs */
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 20px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding-bottom: 4px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  padding: 8px 16px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text-muted);
  font-size: 0.8rem;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
  font-family: inherit;
}
.tab:hover { color: var(--text-secondary); border-color: rgba(255,255,255,0.12); }
.tab.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.tab .tab-count {
  display: inline-block;
  margin-left: 6px;
  font-size: 0.7rem;
  opacity: 0.7;
}

/* Focus Poses (Summary) */
.focus-section {
  background: var(--bg-card);
  border: 1px solid var(--amber-border);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 24px;
}
.focus-section-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.focus-icon {
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}
.focus-section-title {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--amber);
}
.focus-poses {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.focus-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: var(--amber-bg);
  border: 1px solid var(--amber-border);
  border-radius: 16px;
  font-size: 0.78rem;
  color: var(--amber);
  cursor: pointer;
  transition: all 0.2s;
}
.focus-chip:hover { background: rgba(251, 191, 36, 0.18); }
.focus-chip .chip-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--amber);
}

/* Pose List */
.pose-list { display: flex; flex-direction: column; gap: 8px; }
.pose-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.pose-card:hover { background: var(--bg-card-hover); border-color: rgba(255,255,255,0.1); }
.pose-card.expanded { border-color: var(--accent); background: var(--bg-card-hover); }

.pose-status-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  transition: all 0.2s;
}
.pose-status-dot.not_started { background: var(--gray); opacity: 0.4; }
.pose-status-dot.in_progress { background: var(--blue); box-shadow: 0 0 8px rgba(96, 165, 250, 0.4); }
.pose-status-dot.stuck { background: var(--amber); box-shadow: 0 0 8px rgba(251, 191, 36, 0.4); }
.pose-status-dot.complete { background: var(--green); box-shadow: 0 0 8px rgba(74, 222, 128, 0.4); }

.pose-info { flex: 1; min-width: 0; }
.pose-name {
  font-size: 0.9rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pose-english {
  font-size: 0.75rem;
  color: var(--text-muted);
  font-style: italic;
}

.pose-badge {
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 0.7rem;
  font-weight: 600;
  flex-shrink: 0;
  letter-spacing: 0.5px;
}
.pose-badge.not_started { background: var(--gray-bg); color: var(--gray); border: 1px solid var(--gray-border); }
.pose-badge.in_progress { background: var(--blue-bg); color: var(--blue); border: 1px solid var(--blue-border); }
.pose-badge.stuck { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
.pose-badge.complete { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }

.pose-arrow {
  color: var(--text-muted);
  font-size: 0.75rem;
  transition: transform 0.2s;
  flex-shrink: 0;
}
.pose-card.expanded .pose-arrow { transform: rotate(90deg); }

/* Expanded Pose Detail */
.pose-detail {
  display: none;
  padding: 0 16px 16px;
  background: var(--bg-card-hover);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 var(--radius) var(--radius);
  margin-top: -8px;
  animation: slideDown 0.2s ease;
}
.pose-detail.show { display: block; }
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

.detail-description {
  font-size: 0.82rem;
  color: var(--text-secondary);
  line-height: 1.6;
  margin-bottom: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.detail-tip {
  background: var(--accent-glow);
  border-left: 3px solid var(--accent);
  padding: 10px 14px;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  margin-bottom: 16px;
  font-size: 0.78rem;
  color: var(--text-secondary);
  line-height: 1.5;
}
.detail-tip strong { color: var(--accent-light); }

.detail-fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
.detail-field label {
  display: block;
  font-size: 0.7rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
}
.detail-field select,
.detail-field input {
  width: 100%;
  padding: 8px 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 0.82rem;
  font-family: inherit;
  transition: border-color 0.2s;
  outline: none;
}
.detail-field select:focus,
.detail-field input:focus { border-color: var(--accent); }
.detail-field select option { background: var(--bg-secondary); }

.detail-notes {
  margin-bottom: 12px;
}
.detail-notes label {
  display: block;
  font-size: 0.7rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
}
.detail-notes textarea {
  width: 100%;
  min-height: 72px;
  padding: 10px 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 0.82rem;
  font-family: inherit;
  resize: vertical;
  outline: none;
  transition: border-color 0.2s;
  line-height: 1.5;
}
.detail-notes textarea:focus { border-color: var(--accent); }
.detail-notes textarea::placeholder { color: var(--text-muted); }

/* Practice Log */
.log-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-top: 24px;
}
.log-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.log-title { font-size: 0.9rem; font-weight: 600; }
.log-btn {
  padding: 6px 14px;
  background: var(--accent);
  border: none;
  border-radius: 16px;
  color: #fff;
  font-size: 0.78rem;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}
.log-btn:hover { background: var(--accent-light); }
.log-entries { display: flex; flex-direction: column; gap: 8px; }
.log-entry {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  background: var(--bg-primary);
  border-radius: var(--radius-sm);
  font-size: 0.82rem;
}
.log-date { color: var(--text-muted); font-size: 0.75rem; }
.log-note { color: var(--text-secondary); flex: 1; margin-left: 12px; }
.log-delete {
  background: none; border: none; color: var(--text-muted);
  cursor: pointer; font-size: 0.75rem; padding: 2px 6px;
  border-radius: 4px; transition: all 0.2s;
}
.log-delete:hover { color: var(--red); background: var(--red-bg); }
.log-empty {
  text-align: center;
  padding: 20px;
  color: var(--text-muted);
  font-size: 0.82rem;
  font-style: italic;
}

/* Streak Calendar (mini) */
.streak-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 24px;
}
.streak-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.streak-title { font-size: 0.9rem; font-weight: 600; }
.streak-info { font-size: 0.78rem; color: var(--text-muted); }
.streak-grid {
  display: flex;
  gap: 3px;
  flex-wrap: wrap;
}
.streak-day {
  width: 14px; height: 14px;
  border-radius: 3px;
  background: var(--bg-primary);
  transition: all 0.2s;
}
.streak-day.practiced { background: var(--accent); opacity: 0.8; }
.streak-day.today { border: 1px solid var(--accent-light); }

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  max-width: 400px;
  width: 100%;
  box-shadow: var(--shadow);
}
.modal h3 {
  font-size: 1.1rem;
  margin-bottom: 16px;
}
.modal-field { margin-bottom: 12px; }
.modal-field label {
  display: block;
  font-size: 0.75rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
}
.modal-field textarea,
.modal-field input {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 0.85rem;
  font-family: inherit;
  outline: none;
}
.modal-field textarea { min-height: 80px; resize: vertical; }
.modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 16px;
}
.modal-actions button {
  flex: 1;
  padding: 10px;
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
  border: none;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-light); }
.btn-secondary { background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border) !important; }
.btn-secondary:hover { background: var(--bg-card-hover); }

/* Difficulty Dots */
.difficulty {
  display: flex;
  gap: 3px;
  margin-top: 2px;
}
.difficulty-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--text-muted);
  opacity: 0.3;
}
.difficulty-dot.filled { opacity: 1; background: var(--accent-light); }

/* Responsive */
@media (max-width: 640px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .detail-fields { grid-template-columns: 1fr; }
  .header h1 { font-size: 1.6rem; }
  .stat-number { font-size: 1.5rem; }
  .streak-day { width: 10px; height: 10px; }
}

/* Smooth transitions */
.fade-in { animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* Empty state */
.empty-tab {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div class="header-greeting" id="greeting"></div>
    <h1>Ashtanga Primary Series</h1>
    <div class="header-sub">Yoga Chikitsa — Progress Tracker</div>
  </div>

  <!-- Stats -->
  <div class="stats-grid" id="statsGrid"></div>

  <!-- Overall Progress -->
  <div class="overall-progress">
    <div class="progress-header">
      <span class="progress-title">Primary Series Completion</span>
      <span class="progress-pct" id="progressPct">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
    </div>
  </div>

  <!-- Streak Calendar -->
  <div class="streak-section">
    <div class="streak-header">
      <span class="streak-title">🔥 Practice Streak</span>
      <span class="streak-info" id="streakInfo">0 days</span>
    </div>
    <div class="streak-grid" id="streakGrid"></div>
  </div>

  <!-- Focus Poses -->
  <div class="focus-section" id="focusSection" style="display:none">
    <div class="focus-section-header">
      <div class="focus-icon">⚡</div>
      <span class="focus-section-title">Poses Needing Focus</span>
    </div>
    <div class="focus-poses" id="focusPoses"></div>
  </div>

  <!-- Tabs -->
  <div class="tabs" id="tabs"></div>

  <!-- Pose List -->
  <div class="pose-list" id="poseList"></div>

  <!-- Practice Log -->
  <div class="log-section">
    <div class="log-header">
      <span class="log-title">📝 Practice Log</span>
      <button class="log-btn" onclick="openLogModal()">+ Log Practice</button>
    </div>
    <div class="log-entries" id="logEntries"></div>
  </div>
</div>

<!-- Log Modal -->
<div class="modal-overlay" id="logModal">
  <div class="modal">
    <h3>Log Today's Practice</h3>
    <div class="modal-field">
      <label>Date</label>
      <input type="date" id="logDate">
    </div>
    <div class="modal-field">
      <label>Duration (minutes)</label>
      <input type="number" id="logDuration" placeholder="e.g. 75" min="1" max="300">
    </div>
    <div class="modal-field">
      <label>How did it feel? (optional)</label>
      <textarea id="logNotes" placeholder="How was your practice today? Any breakthroughs or challenges?"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeLogModal()">Cancel</button>
      <button class="btn-primary" onclick="saveLog()">Save</button>
    </div>
  </div>
</div>

<script>
// ============================================
// COMPLETE ASHTANGA PRIMARY SERIES DATA
// ============================================
const POSES = [
  // --- SUN SALUTATIONS ---
  { id:'surya_a', cat:'sun', name:'Sūrya Namaskāra A', english:'Sun Salutation A', desc:'The foundational warming sequence. 5 rounds of synchronized breath and movement through 9 positions including forward fold, plank, chaturanga, upward dog, and downward dog.', tip:'Focus on linking each movement to one breath. Inhale = expand/lift, exhale = fold/lower.', difficulty:1 },
  { id:'surya_b', cat:'sun', name:'Sūrya Namaskāra B', english:'Sun Salutation B', desc:'A more vigorous variation adding Utkatasana (Chair) and Virabhadrasana I (Warrior I). 5 rounds building internal heat and stamina.', tip:'Keep heels grounded in Warrior I. The breath should be audible Ujjayi throughout.', difficulty:2 },

  // --- STANDING SEQUENCE ---
  { id:'padangusthasana', cat:'standing', name:'Pādāṅguṣṭhāsana', english:'Big Toe Pose', desc:'Standing forward fold grasping the big toes with the first two fingers. Stretches the entire back body and hamstrings.', tip:'Bend knees slightly if hamstrings are tight. Focus on lengthening the spine rather than forcing the fold.', difficulty:1 },
  { id:'padahastasana', cat:'standing', name:'Pāda Hastāsana', english:'Hand Under Foot Pose', desc:'Standing forward fold with hands placed under the feet, palms up. Deepens the hamstring and wrist stretch.', tip:'Shift weight slightly forward into the balls of the feet to deepen the fold.', difficulty:1 },
  { id:'trikonasana', cat:'standing', name:'Utthita Trikoṇāsana', english:'Extended Triangle Pose', desc:'Wide-legged stance with torso extended sideways over the front leg. Both sides. Opens hips and strengthens legs.', tip:'Think of lengthening both sides of the torso equally. Gaze (drishti) at the upper thumb.', difficulty:1 },
  { id:'parivrtta_trikonasana', cat:'standing', name:'Parivṛtta Trikoṇāsana', english:'Revolved Triangle Pose', desc:'Deep twist in a wide stance with the opposite hand reaching to the floor outside the front foot. Both sides.', tip:'Square the hips before twisting. The back heel stays grounded.', difficulty:2 },
  { id:'parsvakonasana', cat:'standing', name:'Utthita Pārśvakoṇāsana', english:'Extended Side Angle', desc:'Deep side stretch with front knee bent to 90°, bottom hand to floor, top arm extended over the ear. Both sides.', tip:'Press the front knee into the upper arm to open the chest more.', difficulty:1 },
  { id:'parivrtta_parsvakonasana', cat:'standing', name:'Parivṛtta Pārśvakoṇāsana', english:'Revolved Side Angle', desc:'Twisted variation with the opposite arm outside the bent knee. Challenges balance and spinal rotation. Both sides.', tip:'Start with hands in prayer at the chest before extending the arms fully.', difficulty:2 },
  { id:'prasarita_a', cat:'standing', name:'Prasārita Pādottānāsana A', english:'Wide-Legged Forward Fold A', desc:'Wide stance forward fold with hands to the floor, crown of head reaching toward the ground.', tip:'Walk hands back between the feet. Press outer edges of feet into the mat.', difficulty:1 },

const CATEGORIES = [
  { id:'all', label:'All Poses' },
  { id:'summary', label:'Summary' },
  { id:'sun', label:'Sun Salutations' },
  { id:'standing', label:'Standing' },
  { id:'seated', label:'Seated' },
  { id:'backbend', label:'Backbend' },
  { id:'finishing', label:'Finishing' },
];

const STATUS_LABELS = {
  not_started: 'Not Started',
  in_progress: 'In Progress',
  stuck: 'Stuck',
  complete: 'Complete',
};

// ============================================
// STATE
// ============================================
let state = {
  poses: {},
  practiceLog: [],
  practiceDays: [],
  currentTab: 'all',
  expandedPose: null,
};

let userName = 'Daphne';

// ============================================
// INIT
// ============================================
async function init() {
  try {
    if (window.envisage && window.envisage.user) {
      userName = window.envisage.user.name || 'Daphne';
    }
  } catch(e) {}

  // Load saved state
  try {
    if (window.envisage && window.envisage.store) {
      const saved = await window.envisage.store.load();
      if (saved) {
        state = { ...state, ...saved };
      }
    }
  } catch(e) { console.log('No saved state, starting fresh'); }

  // Initialize any missing pose data
  POSES.forEach(p => {
    if (!state.poses[p.id]) {
      state.poses[p.id] = {
        status: 'not_started',
        notes: '',
        dateStarted: '',
        dateCompleted: '',
      };
    }
  });

  render();
}

// ============================================
// SAVE
// ============================================
async function saveState() {
  try {
    if (window.envisage && window.envisage.store) {
      await window.envisage.store.save(state);
    }
  } catch(e) { console.log('Save error:', e); }
}

// ============================================
// RENDER
// ============================================
function render() {
  renderGreeting();
  renderStats();
  renderProgress();
  renderStreak();
  renderFocus();
  renderTabs();
  renderPoses();
  renderLog();
}

function renderGreeting() {
  const hour = new Date().getHours();
  let greeting = 'Good morning';
  if (hour >= 12 && hour < 17) greeting = 'Good afternoon';
  else if (hour >= 17) greeting = 'Good evening';
  document.getElementById('greeting').textContent = `${greeting}, ${userName}`;
}

function renderStats() {
  const counts = { complete: 0, in_progress: 0, stuck: 0, not_started: 0 };
  POSES.forEach(p => {
    const s = state.poses[p.id]?.status || 'not_started';
    counts[s]++;
  });

  // Calculate streak
  const streak = calculateStreak();

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card stat-complete">
      <div class="stat-number">${counts.complete}</div>
      <div class="stat-label">Complete</div>
    </div>
    <div class="stat-card stat-progress">
      <div class="stat-number">${counts.in_progress}</div>
      <div class="stat-label">In Progress</div>
    </div>
    <div class="stat-card stat-stuck">
      <div class="stat-number">${counts.stuck}</div>
      <div class="stat-label">Stuck</div>
    </div>
    <div class="stat-card stat-streak">
      <div class="stat-number">${streak}</div>
      <div class="stat-label">Day Streak</div>
    </div>
  `;
}

function renderProgress() {
  const total = POSES.length;
  const complete = POSES.filter(p => state.poses[p.id]?.status === 'complete').length;
  const pct = Math.round((complete / total) * 100);
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressBar').style.width = pct + '%';
}

function renderStreak() {
  const grid = document.getElementById('streakGrid');
  const today = new Date();
  const days = [];

  for (let i = 27; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const dateStr = d.toISOString().split('T')[0];
    const practiced = (state.practiceDays || []).includes(dateStr);
    const isToday = i === 0;
    days.push(`<div class="streak-day${practiced ? ' practiced' : ''}${isToday ? ' today' : ''}" title="${dateStr}"></div>`);
  }

  grid.innerHTML = days.join('');

  const streak = calculateStreak();
  document.getElementById('streakInfo').textContent = streak === 1 ? '1 day' : `${streak} days`;
}

function calculateStreak() {
  if (!state.practiceDays || state.practiceDays.length === 0) return 0;
  const sorted = [...state.practiceDays].sort().reverse();
  const today = new Date().toISOString().split('T')[0];
  const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];

  if (sorted[0] !== today && sorted[0] !== yesterday) return 0;

  let streak = 1;
  for (let i = 1; i < sorted.length; i++) {
    const prev = new Date(sorted[i-1]);
    const curr = new Date(sorted[i]);
    const diff = (prev - curr) / 86400000;
    if (diff === 1) streak++;
    else break;
  }
  return streak;
}

function renderFocus() {
  const stuckPoses = POSES.filter(p => state.poses[p.id]?.status === 'stuck');
  const section = document.getElementById('focusSection');
  const container = document.getElementById('focusPoses');

  if (stuckPoses.length === 0) {
    section.style.display = 'none';
    return;
  }

  section.style.display = 'block';
  container.innerHTML = stuckPoses.map(p => `
    <div class="focus-chip" onclick="scrollToPose('${p.id}')">
      <span class="chip-dot"></span>
      ${p.name}
    </div>
  `).join('');
}

function renderTabs() {
  const container = document.getElementById('tabs');
  container.innerHTML = CATEGORIES.map(cat => {
    const count = cat.id === 'all' ? POSES.length :
                  cat.id === 'summary' ? '' :
                  POSES.filter(p => p.cat === cat.id).length;
    return `
      <button class="tab${state.currentTab === cat.id ? ' active' : ''}"
              onclick="setTab('${cat.id}')">
        ${cat.label}${count !== '' ? `<span class="tab-count">${count}</span>` : ''}
      </button>
    `;
  }).join('');
}

function renderPoses() {
  const container = document.getElementById('poseList');

  if (state.currentTab === 'summary') {
    renderSummary(container);
    return;
  }

  const poses = state.currentTab === 'all' ? POSES : POSES.filter(p => p.cat === state.currentTab);

  container.innerHTML = poses.map(p => {
    const ps = state.poses[p.id] || { status: 'not_started', notes: '', dateStarted: '', dateCompleted: '' };
    const isExpanded = state.expandedPose === p.id;

    return `
      <div>
        <div class="pose-card${isExpanded ? ' expanded' : ''}" onclick="togglePose('${p.id}')" id="pose-${p.id}">
          <div class="pose-status-dot ${ps.status}"></div>
          <div class="pose-info">
            <div class="pose-name">${p.name}</div>
            <div class="pose-english">${p.english}</div>
            <div class="difficulty">
              ${Array.from({length:5}, (_,i) => `<div class="difficulty-dot${i < p.difficulty ? ' filled' : ''}"></div>`).join('')}
            </div>
          </div>
          <span class="pose-badge ${ps.status}">${STATUS_LABELS[ps.status]}</span>
          <span class="pose-arrow">▶</span>
        </div>
        <div class="pose-detail${isExpanded ? ' show' : ''}" id="detail-${p.id}">
          <div class="detail-description">${p.desc}</div>
          ${p.tip ? `<div class="detail-tip"><strong>Tip:</strong> ${p.tip}</div>` : ''}
          <div class="detail-fields">
            <div class="detail-field">
              <label>Status</label>
              <select onchange="updatePose('${p.id}', 'status', this.value)">
                ${Object.entries(STATUS_LABELS).map(([k,v]) => `<option value="${k}"${ps.status === k ? ' selected' : ''}>${v}</option>`).join('')}
              </select>
            </div>
            <div class="detail-field">
              <label>Date Started</label>
              <input type="date" value="${ps.dateStarted}" onchange="updatePose('${p.id}', 'dateStarted', this.value)">
            </div>
            <div class="detail-field">
              <label>Date Completed</label>
              <input type="date" value="${ps.dateCompleted}" onchange="updatePose('${p.id}', 'dateCompleted', this.value)">
            </div>
          </div>
          <div class="detail-notes">
            <label>Your Notes</label>
            <textarea placeholder="How's your progress? What are you working on?"
                      onchange="updatePose('${p.id}', 'notes', this.value)">${ps.notes || ''}</textarea>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function renderSummary(container) {
  const cats = CATEGORIES.filter(c => c.id !== 'all' && c.id !== 'summary');

  let html = '';

  cats.forEach(cat => {
    const poses = POSES.filter(p => p.cat === cat.id);
    const complete = poses.filter(p => state.poses[p.id]?.status === 'complete').length;
    const inProgress = poses.filter(p => state.poses[p.id]?.status === 'in_progress').length;
    const stuck = poses.filter(p => state.poses[p.id]?.status === 'stuck').length;
    const pct = Math.round((complete / poses.length) * 100);

    html += `
      <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:16px 20px; margin-bottom:12px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <div>
            <div style="font-weight:600; font-size:0.95rem;">${cat.label}</div>
            <div style="font-size:0.75rem; color:var(--text-muted);">${poses.length} poses · ${complete} complete</div>
          </div>
          <div style="font-size:1.2rem; font-weight:700; color:var(--accent-light);">${pct}%</div>
        </div>
        <div class="progress-bar-bg" style="margin-bottom:12px;">
          <div class="progress-bar-fill" style="width:${pct}%"></div>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          ${poses.map(p => {
            const s = state.poses[p.id]?.status || 'not_started';
            const colors = { complete: 'var(--green)', in_progress: 'var(--blue)', stuck: 'var(--amber)', not_started: 'var(--gray)' };
            const opacities = { complete: '1', in_progress: '1', stuck: '1', not_started: '0.3' };
            return `<div style="width:12px;height:12px;border-radius:3px;background:${colors[s]};opacity:${opacities[s]};" title="${p.name}: ${STATUS_LABELS[s]}"></div>`;
          }).join('')}
        </div>
      </div>
    `;
  });

  // Recent milestones
  const completedPoses = POSES
    .filter(p => state.poses[p.id]?.status === 'complete' && state.poses[p.id]?.dateCompleted)
    .sort((a,b) => (state.poses[b.id].dateCompleted || '').localeCompare(state.poses[a.id].dateCompleted || ''))
    .slice(0, 5);

  if (completedPoses.length > 0) {
    html += `
      <div style="background:var(--bg-card); border:1px solid var(--green-border); border-radius:var(--radius); padding:16px 20px; margin-bottom:12px;">
        <div style="font-weight:600; font-size:0.9rem; margin-bottom:12px; color:var(--green);">🎉 Recent Milestones</div>
        ${completedPoses.map(p => `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--border);">
            <span style="font-size:0.85rem;">${p.name}</span>
            <span style="font-size:0.75rem; color:var(--text-muted);">${state.poses[p.id].dateCompleted}</span>
          </div>
        `).join('')}
      </div>
    `;
  }

  // Key poses section
  const keyPoses = ['mari_d', 'supta_kurmasana', 'garbha_pindasana', 'kukkutasana'];
  html += `
    <div style="background:var(--bg-card); border:1px solid var(--accent); border-radius:var(--radius); padding:16px 20px;">
      <div style="font-weight:600; font-size:0.9rem; margin-bottom:12px; color:var(--accent-light);">⭐ Key Milestone Poses</div>
      <div style="font-size:0.78rem; color:var(--text-muted); margin-bottom:12px;">These are the "gate" poses where most practitioners spend significant time. Progress here is a major accomplishment.</div>
      ${keyPoses.map(id => {
        const p = POSES.find(x => x.id === id);
        const ps = state.poses[id] || { status: 'not_started' };
        return `
          <div style="display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border);">
            <div class="pose-status-dot ${ps.status}"></div>
            <div style="flex:1;">
              <div style="font-size:0.85rem; font-weight:500;">${p.name}</div>
              <div style="font-size:0.72rem; color:var(--text-muted); font-style:italic;">${p.english}</div>
            </div>
            <span class="pose-badge ${ps.status}">${STATUS_LABELS[ps.status]}</span>
          </div>
        `;
      }).join('')}
    </div>
  `;

  container.innerHTML = html;
}

function renderLog() {
  const container = document.getElementById('logEntries');
  const logs = (state.practiceLog || []).sort((a,b) => b.date.localeCompare(a.date));

  if (logs.length === 0) {
    container.innerHTML = '<div class="log-empty">No practice sessions logged yet. Start tracking your journey!</div>';
    return;
  }

  container.innerHTML = logs.slice(0, 10).map((log, i) => `
    <div class="log-entry">
      <span class="log-date">${formatDate(log.date)}</span>
      <span class="log-note">${log.duration ? log.duration + ' min' : ''}${log.notes ? ' — ' + log.notes : ''}</span>
      <button class="log-delete" onclick="deleteLog(${i})">✕</button>
    </div>
  `).join('');
}

// ============================================
// INTERACTIONS
// ============================================
function setTab(tabId) {
  state.currentTab = tabId;
  state.expandedPose = null;
  renderTabs();
  renderPoses();
}

function togglePose(poseId) {
  state.expandedPose = state.expandedPose === poseId ? null : poseId;
  renderPoses();
}

function scrollToPose(poseId) {
  // Switch to the right tab
  const pose = POSES.find(p => p.id === poseId);
  if (pose) {
    state.currentTab = 'all';
    state.expandedPose = poseId;
    renderTabs();
    renderPoses();
    setTimeout(() => {
      const el = document.getElementById('pose-' + poseId);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 100);
  }
}

function updatePose(poseId, field, value) {
  if (!state.poses[poseId]) {
    state.poses[poseId] = { status: 'not_started', notes: '', dateStarted: '', dateCompleted: '' };
  }

  state.poses[poseId][field] = value;

  // Auto-set dates
  if (field === 'status') {
    const today = new Date().toISOString().split('T')[0];
    if (value === 'in_progress' && !state.poses[poseId].dateStarted) {
      state.poses[poseId].dateStarted = today;
    }
    if (value === 'complete' && !state.poses[poseId].dateCompleted) {
      state.poses[poseId].dateCompleted = today;
      if (!state.poses[poseId].dateStarted) state.poses[poseId].dateStarted = today;
    }
    if (value === 'stuck' && !state.poses[poseId].dateStarted) {
      state.poses[poseId].dateStarted = today;
    }
  }

  saveState();

  // Re-render if it's a status change
  if (field === 'status') {
    render();
  }
}

function openLogModal() {
  document.getElementById('logModal').classList.add('show');
  document.getElementById('logDate').value = new Date().toISOString().split('T')[0];
  document.getElementById('logDuration').value = '';
  document.getElementById('logNotes').value = '';
}

function closeLogModal() {
  document.getElementById('logModal').classList.remove('show');
}

function saveLog() {
  const date = document.getElementById('logDate').value;
  const duration = document.getElementById('logDuration').value;
  const notes = document.getElementById('logNotes').value;

  if (!date) return;

  if (!state.practiceLog) state.practiceLog = [];
  if (!state.practiceDays) state.practiceDays = [];

  state.practiceLog.push({ date, duration: duration || '', notes: notes || '' });

  if (!state.practiceDays.includes(date)) {
    state.practiceDays.push(date);
  }

  saveState();
  closeLogModal();
  render();
}

function deleteLog(index) {
  const sorted = (state.practiceLog || []).sort((a,b) => b.date.localeCompare(a.date));
  const logToDelete = sorted[index];
  if (!logToDelete) return;

  const origIndex = state.practiceLog.findIndex(l => l.date === logToDelete.date && l.notes === logToDelete.notes);
  if (origIndex > -1) {
    state.practiceLog.splice(origIndex, 1);
  }

  // Check if this date still has other logs
  const dateStillHasLogs = state.practiceLog.some(l => l.date === logToDelete.date);
  if (!dateStillHasLogs) {
    state.practiceDays = (state.practiceDays || []).filter(d => d !== logToDelete.date);
  }

  saveState();
  render();
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

// Close modal on overlay click
document.getElementById('logModal').addEventListener('click', function(e) {
  if (e.target === this) closeLogModal();
});

// Initialize
init();
</script>
</body>
</html>
