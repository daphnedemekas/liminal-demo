# Curiosity Discovery System Configuration
# Research-Based Discovery System

# Model configurations for different LLM roles
#
# Model name format:
# - "cerebras:<model>" uses Cerebras via OpenAI-compatible API
# - "openai:<model>" uses OpenAI
# - "anthropic:<model>" (or "claude-...") uses Anthropic
providers:
  cerebras:
    base_url: "https://api.cerebras.ai/v1"
    timeout_s: 20
  openai:
    timeout_s: 20

models:
  # TEMPORARY: Using OpenAI for all tasks until rate limits reset
  # - Cerebras: daily token limit exceeded
  # - Anthropic: out of credits
  # Once limits reset, can switch back to faster/cheaper options
  
  interviewer:
    name: "openai:gpt-4o"  # Use stronger model for substantive content
    temperature: 0.8  # Higher for more natural, varied conversation
    max_tokens: 500

  ranker:
    name: "openai:gpt-4o-mini"
    temperature: 0.3  # Lower for more consistent analysis
    max_tokens: 3000  # Increased for complex schema updates
    # Optional per-task overrides (falls back to `ranker.name` if omitted)
    branch_classifier:
      name: "openai:gpt-4o-mini"
    profile:
      name: "openai:gpt-4o-mini"
    themes:
      name: "openai:gpt-4o-mini"
    teaching_candidates:
      name: "openai:gpt-4o-mini"
    controller:
      name: "openai:gpt-4o-mini"
    readiness:
      name: "openai:gpt-4o-mini"

# Database settings
database:
  path: "data/liminal.db"  # SQLite database for user profiles and sessions
  echo: false  # Set to true for SQL query debugging

# Conversation settings
conversation:
  max_turns: 8  # Maximum number of back-and-forth exchanges
  min_turns_before_commit: 5  # Minimum turns before allowing topic commitment

# Scoring thresholds (1-5 scale)
thresholds:
  min_prior_knowledge: 3
  min_stakes: 3
  min_confusion_edge: 3
  min_surprise_potential: 2
  min_total_score: 12  # Sum of all four scores

# Debug settings
debug:
  show_ranker_analysis: true  # Set to true to see hidden LLM-B output
  save_transcripts: true
  transcript_dir: "outputs"

# Audio settings
audio:
  elevenlabs:
    api_key_env: "ELEVENLABS_API_KEY"
    voice_id: "c4NIULtANlpduSDihsKJ"  # Custom voice
    model: "eleven_turbo_v2"  # Fast model for real-time feel
  speech_recognition:
    method: "browser"  # Use browser Web Speech API (free, instant)
